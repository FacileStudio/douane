[settings]
lockfile = true

[tools]
lefthook = "latest"
go = "1.25"

[hooks]
postinstall = "lefthook install"

[tasks.build]
run = "go build -o douane ."

[tasks.test]
run = "go test ./..."

# check is the gate: style, architecture and complexity from filet, then the
# tests. One command, so nothing that must pass can be forgotten.
[tasks.check]
depends = ["test"]
run = "filet check"

[tasks.install]
run = "GOBIN=$HOME/go/bin go install ."
