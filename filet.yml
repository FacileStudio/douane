# douane's coding standard, enforced by filet.
# https://github.com/FacileStudio/filet
#
#   filet check .     the rules
#   filet roast .     the rules, with commentary
#
# Migrated from `preset: default` plus a dead `architecture: rules: []` block
# (the `rules:` key is ignored by filet) to the suite standard: filet's own
# strict defaults, nothing disabled but line breaking. main.go is the entry
# point; internal/ owns one package per concern (cli, httpx, osv, inventory,
# finding, enrich, output, store, version).

kind: cli

ignore:
  - .git
  - dist
  - build
  - vendor
  - coverage

extensions: [.go]

limits:
  fileLines: 250        # filet's own default: split the file
  funcsPerFile: 8
  funcLines: 30         # filet's own default
  funcStatements: 25    # filet's own default
  lineLength: 120       # lll default
  params: 5
  returns: 3
  nesting: 4            # filet's own default
  complexity: 10        # filet's own default
  structFields: 12      # filet's own default
  interfaceMethods: 4   # filet's own default

architecture:
  requiredDirs: [internal]

style:
  banInlineComments: true
  banTODO: true
  requireDocComments: true
  banGlobalMutable: true
  banInit: true
  banTrailingSpace: true

disabled:
  # gofmt owns line breaking; a rule turned off here must be an argument, not
  # a habit.
  - gen.line.long

failOn: error